<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>BRÈCHE — Prototype 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* ===== JETONS DE DESIGN : une seule source de vérité pour le style ===== */
  :root{
    --ink:#2a2f45; --ink-soft:#5a5f70;
    --cream:#FFF6E3; --parch:#e8dcc0; --parch-d:#c9b896;
    --gold:#f5c518; --gold-d:#c9a416;
    --stone:#8FA0AE; --wood:#C98A3B;
    --hud:rgba(255,255,255,.66);
    --r:12px; --r-lg:18px; --r-pill:22px;
    --shadow-hud:0 2px 12px rgba(20,30,50,.14);
    --shadow-card:0 14px 44px rgba(20,30,50,.35), inset 0 0 0 2px var(--parch);
    --t:transform .12s ease, box-shadow .12s ease, filter .15s ease, background .15s ease;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; background: #BFE3F2;
               -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  #app { position: fixed; inset: 0; touch-action:none; }
  canvas { display: block; touch-action:none; }
  .hud { position: fixed; pointer-events: none; color: #2a2f45; }
  #title { top: 12px; left: 16px; font-weight: 800; font-size: 19px; font-family:'Cinzel',Georgia,serif; color:var(--ink);
           letter-spacing:1px; text-shadow:0 1px 2px rgba(255,255,255,.5); }
  #title small { display:block; font-weight:500; font-size:11.5px; opacity:.7; letter-spacing:0; }
  #mode { top: 14px; left: 50%; transform: translateX(-50%); font-weight: 800; font-size: 15px; color:var(--ink);
          background: var(--hud); padding: 7px 18px; border-radius: var(--r-pill); box-shadow:var(--shadow-hud);
          backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); letter-spacing:.5px; }
  #shots { top: 16px; right: 16px; font-weight: 700; font-size: 16px; text-align: right; letter-spacing:1px; }
  #help { bottom: 14px; left: 16px; font-size: 13px; line-height: 1.5; background: var(--hud); color:var(--ink);
          padding: 10px 14px; border-radius: var(--r); max-width: 340px; box-shadow:var(--shadow-hud);
          backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); }
  #palette { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  #palette button { pointer-events: auto; border: 3px solid transparent; min-width: 58px; height: 54px;
                    border-radius: var(--r); cursor: pointer; font-size: 12px; font-weight: 700; color: #fff;
                    text-shadow:0 1px 2px rgba(0,0,0,.4); box-shadow: 0 2px 8px rgba(20,30,50,.18); padding:0 8px;
                    transition:var(--t); }
  #palette button:hover { filter:brightness(1.06); transform:translateY(-1px); }
  #palette button.sel { border-color: #fff; transform: translateY(-4px); box-shadow:0 6px 14px rgba(20,30,50,.28), 0 0 0 3px var(--ink); }
  .btns { position: fixed; bottom: 16px; right: 16px; display: flex; gap: 8px; align-items:center; }
  .btns button { pointer-events: auto; border: none; background: var(--cream); color: var(--ink); font-weight: 700;
                 font-size: 16px; height: 50px; min-width: 50px; padding: 0 16px; border-radius: var(--r);
                 cursor: pointer; box-shadow: 0 3px 0 var(--parch-d); transition:var(--t);
                 display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  .btns button:hover { filter:brightness(1.05); }
  .btns button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--parch-d); }
  .btns button svg { width:20px; height:20px; display:block; }
  /* groupe d'outils (tourner/annuler) visuellement réuni et discret */
  .toolgrp { pointer-events:auto; display:inline-flex; gap:2px; background:rgba(255,246,227,.55); padding:5px;
             border-radius:var(--r); box-shadow:0 2px 8px rgba(20,30,50,.12); margin-right:4px; }
  .toolgrp button { height:40px; min-width:40px; padding:0 10px; box-shadow:none; background:transparent; }
  .toolgrp button:active { transform:translateY(1px); box-shadow:none; background:rgba(0,0,0,.05); }
  #siegeBtn { background:var(--parch); box-shadow:0 3px 0 var(--parch-d); }
  #action { background: var(--gold); box-shadow:0 3px 0 var(--gold-d); }
  #action:active { box-shadow:0 1px 0 var(--gold-d); }
  .btns button:disabled { opacity:.4; box-shadow:0 1px 0 var(--parch-d); cursor:not-allowed; filter:grayscale(.4); transform:none; }
  #power { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); width: 248px; height: 24px;
           background: rgba(255,255,255,.62); border-radius: var(--r); overflow: hidden; display: none;
           box-shadow:var(--shadow-hud), inset 0 0 0 2px rgba(255,255,255,.5);
           backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); }
  #power > i { position:absolute; left:0; top:0; height: 100%; width: 0%; background: linear-gradient(90deg,#7ec850,#f5c518,#e0653c); transition:width .03s linear; }
  #power > span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                  font-size:11px; font-weight:800; letter-spacing:3px; color:var(--ink); opacity:.7; pointer-events:none; }
  /* graduations de la jauge */
  #power::after { content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
                  background:repeating-linear-gradient(90deg,transparent 0,transparent 48px,rgba(42,47,69,.18) 48px,rgba(42,47,69,.18) 49px); }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; }
  #msg b { font-size: 62px; font-weight: 900; color: #fff; text-shadow: 0 4px 0 #e0653c, 0 0 30px rgba(0,0,0,.25);
           animation: pop .35s ease; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align:center;
          color:#2a2f45; font-size: 16px; padding: 24px; }
  #serment { position: fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(20,30,50,.45); }
  #serment .scard { background:#FFF6E3; padding:22px 26px; border-radius:18px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.3); pointer-events:auto; }
  #serment h3 { font-size:15px; color:#2a2f45; margin-bottom:10px; letter-spacing:.5px; font-family:'Cinzel',Georgia,serif; }
  #serment canvas { background:#fff; border-radius:8px; }
  #serment .sname { font-size:20px; font-weight:800; color:#2a2f45; margin:10px 0; font-family:'Cinzel',Georgia,serif; }
  #serment .srow { display:flex; gap:8px; justify-content:center; margin-bottom:12px; }
  #serment button { border:none; background:#e8dcc0; color:#2a2f45; font-weight:700; padding:8px 14px; border-radius:10px; cursor:pointer; }
  #serment .swear { background:#f5c518; font-size:16px; padding:12px 22px; box-shadow:0 3px 0 #c9a416; }
  #banner { position:fixed; top:44px; left:16px; display:none; gap:8px; align-items:center; background:rgba(255,255,255,.6);
            padding:5px 12px 5px 7px; border-radius:12px; color:#2a2f45; pointer-events:none; }
  #banner b { font-size:15px; font-family:'Cinzel',Georgia,serif; } #banner small { opacity:.75; font-size:12px; }
  #endscreen { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(20,30,50,.5); }
  #endscreen .ecard { background:#FFF6E3; padding:26px 34px; border-radius:18px; text-align:center; box-shadow:0 12px 44px rgba(0,0,0,.35); pointer-events:auto; }
  #endTitle { font-size:38px; font-weight:900; color:#2a2f45; margin-bottom:6px; font-family:'Cinzel',Georgia,serif; }
  #endSub { font-size:15px; color:#5a5f70; margin-bottom:18px; }
  #endscreen .erow { display:flex; gap:10px; justify-content:center; }
  #endscreen button { border:none; font-weight:700; font-size:15px; padding:12px 18px; border-radius:12px; cursor:pointer; }
  #replayBtn { background:#f5c518; box-shadow:0 3px 0 #c9a416; }
  #rebuildBtn { background:#e8dcc0; box-shadow:0 3px 0 #c9b896; }
  /* --- cohérence des boutons (jeton qui s'enfonce, partout) --- */
  #serment button, #endscreen button { box-shadow:0 3px 0 #d8cdae; transition:transform .1s ease, box-shadow .1s ease; }
  #serment button:active, #endscreen button:active { transform:translateY(2px); box-shadow:0 1px 0 #d8cdae; }
  #serment .swear { box-shadow:0 3px 0 #c9a416; } #serment .swear:active { box-shadow:0 1px 0 #c9a416; }
  .btns button:disabled { opacity:.4; box-shadow:0 1px 0 #d8cdae; cursor:not-allowed; filter:grayscale(.4); transform:none; }
  /* --- pop des compteurs + pastilles --- */
  @keyframes popcount { 0%{transform:scale(1)} 40%{transform:scale(1.2)} 100%{transform:scale(1)} }
  .pop { display:inline-block; animation:popcount .3s ease; }
  #gloireHud, #shots { background:var(--hud); padding:6px 15px; border-radius:var(--r-pill); box-shadow:var(--shadow-hud);
                       backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); }
  #gloireHud { color:#a06a00; }
  /* --- écran-titre --- */
  #home { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
          background:linear-gradient(180deg,#CFEBF7,#FFF6E3); text-align:center; }
  #home .logo { font-family:'Cinzel',serif; font-weight:800; font-size:clamp(56px,12vw,100px); color:#2a2f45;
                letter-spacing:5px; line-height:1; text-shadow:0 3px 0 #fff, 0 7px 20px rgba(20,30,50,.22); }
  #home .logo-sub { font-family:'Cinzel',serif; font-size:15px; letter-spacing:6px; text-transform:uppercase; color:#5a5f70; margin:12px 0 34px; }
  #home .home-btn { display:block; width:300px; margin:11px auto; height:56px; font-size:18px; border:none; border-radius:14px; cursor:pointer;
                    font-family:'Inter',sans-serif; font-weight:700; color:#2a2f45; background:#e8dcc0; box-shadow:0 3px 0 #c9b896; }
  #home .home-btn.primary { background:#f5c518; box-shadow:0 3px 0 #c9a416; }
  #home .home-btn:active { transform:translateY(2px); box-shadow:0 1px 0 #c9b896; }
  #home .home-ghost { background:transparent; box-shadow:none; color:#5a5f70; font-size:14px; height:42px; }
  /* --- modales parchemin + flou de fond --- */
  #serment, #endscreen { backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  #serment .scard, #endscreen .ecard { box-shadow:0 14px 44px rgba(20,30,50,.35), inset 0 0 0 2px #e0d3b0; }
  /* --- mini-tuto 1er tir --- */
  #tuthint { position:fixed; left:50%; bottom:120px; transform:translateX(-50%); display:none; z-index:30; pointer-events:none;
             background:rgba(42,47,69,.88); color:#fff; padding:12px 20px; border-radius:14px; font-weight:700; font-size:15px;
             box-shadow:0 6px 20px rgba(0,0,0,.3); animation:popcount .3s ease; }
  /* --- sélecteur de forteresses (campagne) --- */
  #levels { position:fixed; inset:0; z-index:55; display:none; align-items:center; justify-content:center;
            background:rgba(20,30,50,.5); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  #levels .lcard { background:#FFF6E3; padding:24px 26px; border-radius:18px; text-align:center; max-width:540px;
                   box-shadow:0 14px 44px rgba(20,30,50,.35), inset 0 0 0 2px #e0d3b0; pointer-events:auto; }
  #levels h3 { font-family:'Cinzel',serif; font-size:18px; color:#2a2f45; margin-bottom:16px; letter-spacing:1px; }
  #lgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .lvl { display:flex; align-items:center; gap:12px; text-align:left; padding:11px 13px; border:none; border-radius:12px; cursor:pointer;
         background:#fff; box-shadow:0 2px 0 #d8cdae; font-family:'Inter',sans-serif; transition:transform .1s ease; }
  .lvl:hover { transform:translateY(-2px); }
  .lvl:active { transform:translateY(2px); box-shadow:0 1px 0 #d8cdae; }
  .lvl .lnum { font-family:'Cinzel',serif; font-weight:800; font-size:20px; color:#fff; background:#8FA0AE; min-width:36px; height:36px;
               border-radius:9px; display:flex; align-items:center; justify-content:center; }
  .lvl.done .lnum { background:#7ec850; }
  .lvl .lname { font-weight:700; font-size:14px; color:#2a2f45; line-height:1.2; }
  .lvl .lmeta { font-size:11px; color:#8a7f66; margin-top:2px; }
  #lclose { margin-top:16px; border:none; background:#e8dcc0; color:#2a2f45; font-weight:700; padding:10px 20px; border-radius:11px;
            cursor:pointer; box-shadow:0 3px 0 #c9b896; font-family:'Inter',sans-serif; }
  #lclose:active { transform:translateY(2px); box-shadow:0 1px 0 #c9b896; }
  /* icônes SVG dans les fenêtres + boutons à libellé */
  #serment button, #endscreen button, #lclose { display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  #serment button svg, #endscreen button svg, #lclose svg, #action svg, #siegeBtn svg { width:18px; height:18px; flex:none; }
  #siegeBtn, #action { gap:7px; }
  /* --- info matériau sous la palette --- */
  #palhint { position:fixed; top:104px; left:50%; transform:translateX(-50%); display:none; pointer-events:none; z-index:20;
             background:rgba(42,47,69,.86); color:#fff; padding:6px 14px; border-radius:11px; font-size:12.5px; font-weight:600;
             white-space:nowrap; box-shadow:0 3px 12px rgba(0,0,0,.22); }
  /* ===== ADAPTATION TÉLÉPHONE / PETITS ÉCRANS ===== */
  @media (max-width:600px){
    #title { font-size:15px; } #title small { display:none; }
    #mode { font-size:12.5px; padding:5px 13px; top:10px; }
    #shots { font-size:14px; top:12px; right:12px; }
    #gloireHud { font-size:14px !important; }
    #palette { top:46px; gap:5px; } #palette button { min-width:50px; height:50px; font-size:11px; }
    #palhint { font-size:11px; top:100px; white-space:normal; max-width:92vw; text-align:center; line-height:1.3; }
    #help { font-size:11px; max-width:46vw; padding:7px 9px; bottom:10px; left:10px; }
    .btns { bottom:10px; right:10px; gap:6px; }
    .btns button { height:46px; min-width:46px; font-size:13px; padding:0 11px; }
    .btns button > span { display:none; }            /* sur mobile : icônes seules, plus compact */
    #siegeBtn > span, #action > span { display:inline; } /* sauf les 2 actions principales (texte gardé) */
    #power { width:200px; bottom:80px; }
    #serment .scard, #endscreen .ecard { max-width:92vw; padding:18px 16px; }
    #lgrid { grid-template-columns:1fr; } #levels .lcard { max-width:92vw; }
    #home .home-btn { width:84vw; max-width:320px; }
    #endTitle { font-size:30px; }
  }
  @media (max-width:600px) and (orientation:portrait){
    #help { max-width:60vw; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="boot">Chargement de la 3D…</div>

<div id="home"><div>
  <div class="logo">BRÈCHE</div>
  <div class="logo-sub">Bâtis · Scelle · Brise</div>
  <button class="home-btn primary" id="homeBuild">🧱 Bâtir mon château</button>
  <button class="home-btn" id="homeCampaign">🏰 Campagne — 7 forteresses</button>
  <button class="home-btn home-ghost" id="homeContinue">↩ Reprendre la campagne</button>
</div></div>

<div id="levels"><div class="lcard">
  <h3>🏰 CHOISIS TA FORTERESSE</h3>
  <div id="lgrid"></div>
  <button id="lclose">↩ Retour</button>
</div></div>

<div id="palhint"></div>
<div id="tuthint">👋 Maintiens, <b>tire le boulet vers le bas</b>, puis relâche pour lancer !</div>
<div class="hud" id="title">BRÈCHE <small>Bâtis · Protège le coffre · Brise</small></div>
<div class="hud" id="mode">🧱 ATELIER</div>
<div class="hud" id="shots" style="display:none">Tirs : 0</div>
<div class="hud" id="gloireHud" style="top:16px;right:16px;display:none;font-weight:700;font-size:16px">⚜ Gloire 0</div>
<div class="hud" id="help"></div>
<div id="palette"></div>
<div id="power"><i></i><span>FORCE</span></div>
<div class="btns">
  <span class="toolgrp">
    <button id="rotL" title="Tourner à gauche" aria-label="Tourner à gauche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/></svg></button>
    <button id="rotR" title="Tourner à droite" aria-label="Tourner à droite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg></button>
    <button id="undo" title="Annuler la dernière pièce" aria-label="Annuler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  </span>
  <button id="siegeBtn">🏰 Assiéger</button>
  <button id="action">⚔️ Sceller &amp; Assaut</button>
</div>
<div id="msg"><b>BRÈCHE !</b></div>

<div id="serment"><div class="scard">
  <h3>⚜ LE SERMENT DU BÂTISSEUR ⚜</h3>
  <canvas id="blason" width="120" height="142"></canvas>
  <div class="sname" id="sName">—</div>
  <div id="sGloire" style="font-size:13px;color:#a06a00;font-weight:700;margin-bottom:8px">⚜ Gloire : 0</div>
  <div class="srow"><button id="rerollName">🎲 Nom</button><button id="rerollBlason">🎲 Blason</button></div>
  <button id="swear" class="swear">✊ Prêter serment</button>
  <div class="srow" style="margin-top:10px"><button id="share">🔗 Partager (lien)</button></div>
  <div id="sStatus" style="font-size:12px;color:#2a8a4a;margin-top:8px;min-height:14px;max-width:240px"></div>
</div></div>

<div id="banner"><canvas id="bBlason" width="40" height="48"></canvas><div><b id="bName"></b><br><small id="bHold"></small></div></div>

<div id="endscreen"><div class="ecard">
  <div id="endTitle">🏆 BRÈCHE !</div>
  <div id="endSub"></div>
  <div class="erow">
    <button id="replayBtn">↻ Rejouer l'assaut</button>
    <button id="rebuildBtn">🔨 Bâtir un château</button>
  </div>
</div></div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "rapier": "https://esm.sh/@dimforge/rapier3d-compat@0.14.0",
    "lzstring": "https://esm.sh/lz-string@1.5.0" } }
</script>

<script type="module">
import * as THREE from 'three';
import RAPIER from 'rapier';
import * as LZmod from 'lzstring';
const LZString = LZmod.default || LZmod;

const boot = document.getElementById('boot');
try { await RAPIER.init(); boot.remove(); start(); }
catch (e) { boot.innerHTML = "❌ 3D non chargée. Ouvre via http://localhost (Laragon).<br><br>"+e; console.error(e); }

function start() {
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // ===== JEU D'ICÔNES SVG (trait, hérite de la couleur du texte) =====
  const svg = p => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
  const ICONS = {
    castle: svg('<path d="M3 21h18M5 21V10l2-1V7l2 1 1-1 1 1 2-1v2l2 1v11M10 21v-3a2 2 0 0 1 4 0v3"/>'),
    hammer: svg('<path d="M15 6l3 3M9 12l6-6 3 3-6 6zM9 12l-5 5a1.4 1.4 0 0 0 2 2l5-5z"/>'),
    flag:   svg('<path d="M6 21V4M6 4h11l-2.5 4L17 12H6"/>'),
    replay: svg('<path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v4h-4"/>'),
    next:   svg('<path d="M5 12h13M12 6l6 6-6 6"/>'),
    dice:   svg('<rect x="4.5" y="4.5" width="15" height="15" rx="2.5"/><circle cx="9" cy="9" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="15" r="1.3" fill="currentColor" stroke="none"/>'),
    link:   svg('<path d="M9 15l6-6M10.5 8.5l1-1a3.5 3.5 0 0 1 5 5l-1 1M13.5 15.5l-1 1a3.5 3.5 0 0 1-5-5l1-1"/>'),
    back:   svg('<path d="M11 17l-5-5 5-5M6 12h13"/>'),
  };
  const scene = new THREE.Scene();
  const skyCv=document.createElement('canvas'); skyCv.width=2; skyCv.height=256;     // ciel en dégradé
  const sctx=skyCv.getContext('2d'); const sg=sctx.createLinearGradient(0,0,0,256);
  sg.addColorStop(0,'#9FCDEA'); sg.addColorStop(1,'#FFF6E3'); sctx.fillStyle=sg; sctx.fillRect(0,0,2,256);
  scene.background = new THREE.CanvasTexture(skyCv);
  scene.fog = new THREE.Fog(0xDCEAF2, 24, 62);                                       // brume douce à l'horizon
  const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);

    ghost.visible=false; scene.add(ghost); }
  const raycaster=new THREE.Raycaster(), ndc=new THREE.Vector2();
  function cellUnderPointer(cx,cy){ ndc.set((cx/innerWidth)*2-1, -(cy/innerHeight)*2+1);
    raycaster.setFromCamera(ndc,camera);
    const hits=raycaster.intersectObjects([planeRay, ...blocks.map(b=>b.group)], true);
    if(!hits.length) return null; const p=hits[0].point;
    const gx=Math.round(p.x), gz=Math.round(p.z); if(Math.hypot(gx,gz)>baseR-0.5) return null;
    let top=0; for(const b of blocks){ if(Math.round(b.group.position.x)===gx && Math.round(b.group.position.z)===gz) top=Math.max(top,b.group.position.y+b.half[1]); }
    return { x:gx, y:top+PIECES[selected].half[1], z:gz }; }

  // ---------- ENTRÉES ----------
  const POW_MIN=8,POW_MAX=30; let aiming=false,currentPower=POW_MIN,currentAngle=0.4,aimSX=0,aimSY=0;
  const powerWrap=document.getElementById('power'), powerFill=powerWrap.firstElementChild;
  const powerFromCharge=t=>{ const P=1.5,ph=(t%P)/P,tri=ph<.5?ph*2:2-ph*2; return POW_MIN+tri*(POW_MAX-POW_MIN); };
  const cnv=renderer.domElement;
  cnv.addEventListener('pointermove',e=>{
    if(mode==='build'){ const c=cellUnderPointer(e.clientX,e.clientY);
      if(c){ ghost.visible=true; ghost.position.set(c.x,c.y,c.z); ghost.material.color.set(isOpenSlot(c.x,c.z)?0x7ec850:PIECES[selected].color); } else ghost.visible=false; return; }
    if(aiming){ const dx=e.clientX-aimSX, dy=e.clientY-aimSY, L=Math.hypot(dx,dy);  // visée-fronde : glisse pour viser
      currentPower=Math.min(POW_MAX, POW_MIN + L*0.11);                              // longueur = puissance
      currentAngle=Math.max(0.12, Math.min(1.0, Math.atan2(Math.max(0,dy), Math.abs(dx)+1)));  // glisse bas = cloche · côté = tendu
      powerFill.style.width=((currentPower-POW_MIN)/(POW_MAX-POW_MIN)*100)+'%'; updateTraj(currentPower,currentAngle); } });
  cnv.addEventListener('pointerdown',e=>{ audio();
    if(mode==='build'){ const c=cellUnderPointer(e.clientX,e.clientY); if(c){ const o=addPiece(selected,c.x,c.y,c.z); o.placedGlow=1.2; sndPlace(); } }
    else { document.getElementById('tuthint').style.display='none'; try{localStorage.setItem('breche:tut','1');}catch(e){}
      aiming=true; aimSX=e.clientX; aimSY=e.clientY; currentPower=POW_MIN; currentAngle=0.35; powerWrap.style.display='block'; updateTraj(currentPower,currentAngle); } });
  addEventListener('pointerup',()=>{ if(!aiming)return; aiming=false; powerWrap.style.display='none'; traj.visible=false; impactRing.visible=false; aimMark.visible=false;
    if(mode==='assault' && !won && !held && shotsLeft>0){ fire(currentPower,currentAngle); shotsLeft--; updateShotsHUD(); if(shotsLeft===0) assessTimer=2.8; } });
  document.getElementById('rotL').onclick=()=>rotate(+1);
  document.getElementById('rotR').onclick=()=>rotate(-1);
  addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')rotate(+1); if(e.key==='ArrowRight')rotate(-1);
    const i=['1','2','3','4'].indexOf(e.key); if(mode==='build'&&i>=0){ selected=['wall','tower','towerW','beam'][i]; buildPalette(); makeGhost(); } });
  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

  // ---------- JUS sur collisions ----------
  let lastThud=0; const toShatter=[];
  function handleCollisions(now){ let n=0;
    eventQueue.drainCollisionEvents((h1,h2,started)=>{ if(!started||n>=4)return;
      const o1=colMap.get(h1), o2=colMap.get(h2);
      const proj=(o1&&o1.kind==='proj')||(o2&&o2.kind==='proj');
      const obj=(o1&&o1.kind!=='proj')?o1:(o2&&o2.kind!=='proj'?o2:(o1||o2)); if(!obj||!obj.body) return;
      const lv=obj.body.linvel(), sp=Math.hypot(lv.x,lv.y,lv.z);
      const isWood=(obj.type==='towerW'||obj.type==='beam');
      if(isWood && (proj||sp>6) && !obj.broken){     // 🪵 LE BOIS ÉCLATE sous un bon choc
        obj.broken=true; const t=obj.body.translation();
        spawnDebris(t.x,t.y,t.z, obj.color, 14); spawnDust(t.x,t.y,t.z,5);
        shake=Math.max(shake,.32); if(now-lastThud>0.05){ sndCrack(); lastThud=now; }
        toShatter.push(obj); n++; return; }
      if(proj||sp>3.6){ const t=obj.body.translation();   // 🪨 la pierre encaisse et bascule
        spawnDust(t.x,t.y,t.z, proj?4:2); if(proj) spawnDebris(t.x,t.y,t.z, obj.color||0x999999, 3);
        shake=Math.max(shake, Math.min(.28, sp*0.028 + (proj?0.10:0)));
        if(now-lastThud>0.09){ sndThud(); lastThud=now; } n++; } });
    for(const o of toShatter) removeBlock(o); toShatter.length=0; }

  // ---------- BOUCLE ----------
  const clock=new THREE.Clock(); let tNow=0;
  function loop(){ let dt=clock.getDelta(); if(dt>.05)dt=.05; tNow+=dt;
    if(hitStop>0){ hitStop-=dt; }            // hit-stop : on gèle la physique un instant
    else { world.step(eventQueue); handleCollisions(tNow); }
    for(const b of blocks){ const t=b.body.translation(), r=b.body.rotation();
      b.group.position.set(t.x,t.y,t.z); b.group.quaternion.set(r.x,r.y,r.z,r.w);
      if(b.pop>0){ b.pop=Math.max(0,b.pop-dt*6); const k=1+b.pop*0.18; b.group.scale.setScalar(k); } }
    for(const p of projectiles){ const t=p.body.translation(), r=p.body.rotation();
      p.group.position.set(t.x,t.y,t.z); p.group.quaternion.set(r.x,r.y,r.z,r.w); }
    updateParticles(dt); updateGuidance(); updateStability(dt); updateAssault(dt); checkWin(); updateBeacon(); updateCamera(dt); updateTreb();
    sun.intensity += (sunBase-sun.intensity)*Math.min(1,dt*3); renderer.render(scene,camera);
    requestAnimationFrame(loop); }
  makeGhost();
  // icônes SVG sur les boutons à texte fixe (un seul endroit, cohérent)
  const setBtnHTML=(id,icon,label)=>{ const b=document.getElementById(id); if(b) b.innerHTML=icon+'<span>'+label+'</span>'; };
  setBtnHTML('siegeBtn',ICONS.castle,'Assiéger');
  setBtnHTML('swear',ICONS.flag,'Prêter serment');
  setBtnHTML('share',ICONS.link,'Partager');
  setBtnHTML('rerollName',ICONS.dice,'Nom');
  setBtnHTML('rerollBlason',ICONS.dice,'Blason');
  setBtnHTML('rebuildBtn',ICONS.hammer,'Bâtir un château');
  setBtnHTML('lclose',ICONS.back,'Retour');
  setBtnHTML('replayBtn',ICONS.replay,"Rejouer l'assaut");
  const homeEl=document.getElementById('home');
  const closeHome=()=>homeEl.style.display='none';
  document.getElementById('homeBuild').onclick=()=>{ audio(); closeHome(); toBuild(); };
  document.getElementById('homeCampaign').onclick=()=>{ audio(); closeHome(); openLevels(); };
  document.getElementById('homeContinue').onclick=()=>{ audio(); closeHome(); startSiege(Math.min(campaign,GRAINES.length-1)); };
  if(campaign<=0) document.getElementById('homeContinue').style.display='none';
  if(loadFromHash()) closeHome();   // lien partagé : on saute l'accueil, direct à l'assaut
  else toBuild();                   // l'atelier se prépare derrière l'écran-titre
  loop();
}
</script>
</body>
</html>
